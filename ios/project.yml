name: Veil
options:
  bundleIdPrefix: dev.veil
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_ENABLE_EXPLICIT_MODULES: 'NO'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: 'NO'
targets:
  Veil:
    type: application
    platform: iOS
    sources:
      - path: Veil
        excludes:
          - '**/*.plist'
      - path: ../licenses
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.veil.messenger
        GENERATE_INFOPLIST_FILE: 'NO'
        INFOPLIST_FILE: Veil/Info.plist
      configs:
        Debug:
          INFOPLIST_FILE: Veil/Info-Debug.plist
    scheme:
      testTargets:
        - VeilTests
      gatherCoverageData: true
  VeilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeilTests
    dependencies:
      - target: Veil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.veil.messenger.tests
        GENERATE_INFOPLIST_FILE: 'YES'
